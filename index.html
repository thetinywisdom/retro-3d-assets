<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sony PVM-9042QM — dev</title>
<style>
  html, body { margin: 0; height: 100%; background: #1b1b1d; color: #ddd; font-family: system-ui, sans-serif; }
  sony-pvm { height: 100vh; }
</style>
</head>
<body>
<sony-pvm id="pvm"></sony-pvm>
<script type="module">
  import './src/index.js';
  window.pvm = document.getElementById('pvm');

  if (m) window.pvm.setAttribute('model', m);
</script>
